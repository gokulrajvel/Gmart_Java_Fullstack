spring.application.name=Gmart_Full_Stack
# Database Configuration (Reads from Environment Variables, falls back to local DB if not defined)
spring.datasource.url=jdbc:mysql://mysql-d7cceb9-gmart.c.aivencloud.com:10665/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP Connection Pool settings (to stay under 5 connection limit)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.keepalive-time=30000
# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# spring.main.web-application-type=none
# Session Cookie Configuration (Security Best Practices)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30d

# Redis Connection Configuration (Falls back to localhost:6379)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
